<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITES 및 국내 멸종위기종 통합 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-gray-50 to-gray-200">

    <!-- 메인 컨테이너 (반응형 대응) -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl p-6 sm:p-10 transition-all">
        <!-- 헤더 영역 -->
        <div class="text-center mb-8 max-w-2xl mx-auto">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-3 tracking-tight">생물종 통합 정보 조회</h1>
            <p class="text-gray-500 text-sm sm:text-base">생물의 학명을 입력하여 <span class="font-semibold text-blue-600">CITES</span>, <span class="font-semibold text-green-600">국내 멸종위기종</span>, <span class="font-semibold text-cyan-600">해양보호생물</span> 등 해당 여부를 확인하세요.</p>
            <a href="agent.html" class="inline-flex items-center mt-3 text-sm font-semibold text-blue-600 hover:text-blue-700 hover:underline">자연어로 물어보기 (전문 상담 챗봇) →</a>

            <!-- 공공데이터 로딩 상태 표시 바 -->
            <div id="initStatus" class="mt-4 inline-flex items-center text-sm px-3 py-1 rounded-full bg-blue-50 text-blue-600">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                국내 멸종위기종 데이터를 불러오는 중...
            </div>
        </div>

        <form id="searchForm" class="space-y-6 max-w-2xl mx-auto">
            <div class="relative">
                <label for="scientificName" class="block text-sm font-semibold text-gray-700 mb-2">학명 (Scientific Name)</label>
                <input type="text" id="scientificName" name="scientificName" required
                    class="w-full px-5 py-4 rounded-xl border border-gray-300 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all text-lg shadow-sm"
                    placeholder="예: Panthera tigris, Lutra lutra" autocomplete="off">
            </div>

            <button type="submit" id="searchBtn" disabled
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-xl transition-colors flex justify-center items-center shadow-lg shadow-blue-500/30">
                <span>통합 조회하기</span>
                <!-- 로딩 스피너 (기본적으로 숨김) -->
                <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div id="resultContainer" class="mt-10 hidden transition-all duration-300 ease-in-out">
            <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200">조회 결과</h2>
            
            <!-- 에러 메시지 표시 영역 -->
            <div id="errorContent" class="hidden text-center py-4 bg-red-50 text-red-600 rounded-xl mb-4 border border-red-100">
                <!-- 에러 내용이 동적으로 삽입됨 -->
            </div>

            <!-- 결과 카드 그리드 (PC에서는 가로 배치, 모바일에서는 세로 배치) -->
            <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                
                <!-- CITES 결과 카드 -->
                <div id="citesCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        CITES 국제 규제
                    </h3>
                    <div id="citesContent" class="flex-grow flex flex-col justify-center">
                        <!-- CITES 데이터 삽입 -->
                    </div>
                </div>

                <!-- 국내 멸종위기종 결과 카드 -->
                <div id="endangeredCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        국내 멸종위기종
                    </h3>
                    <div id="endangeredContent" class="flex-grow flex flex-col justify-center">
                        <!-- 멸종위기 데이터 삽입 -->
                    </div>
                </div>

                <!-- 국외반출승인대상 결과 카드 -->
                <div id="exportCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        국외반출승인대상
                    </h3>
                    <div id="exportContent" class="flex-grow flex flex-col justify-center">
                        <!-- 국외반출 데이터 삽입 -->
                    </div>
                </div>

                <!-- 유입주의생물 결과 카드 -->
                <div id="invasiveCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        유입주의생물
                    </h3>
                    <div id="invasiveContent" class="flex-grow flex flex-col justify-center">
                        <!-- 유입주의 데이터 삽입 -->
                    </div>
                </div>

                <!-- 생태계교란생물 결과 카드 -->
                <div id="disturbanceCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        생태계교란생물
                    </h3>
                    <div id="disturbanceContent" class="flex-grow flex flex-col justify-center">
                        <!-- 생태계교란 데이터 삽입 -->
                    </div>
                </div>

                <!-- 생태계위해우려생물 결과 카드 -->
                <div id="riskCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        생태계위해우려생물
                    </h3>
                    <div id="riskContent" class="flex-grow flex flex-col justify-center">
                        <!-- 생태계위해우려 데이터 삽입 -->
                    </div>
                </div>

                <!-- 해양보호생물 결과 카드 -->
                <div id="marineProtectedCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        해양보호생물
                    </h3>
                    <div id="marineProtectedContent" class="flex-grow flex flex-col justify-center">
                        <!-- 해양보호생물 데이터 삽입 -->
                    </div>
                </div>

                <!-- 회유성해양생물 결과 카드 -->
                <div id="migratoryMarineCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        회유성해양생물
                    </h3>
                    <div id="migratoryMarineContent" class="flex-grow flex flex-col justify-center">
                        <!-- 회유성해양생물 데이터 삽입 -->
                    </div>
                </div>

                <!-- 유해해양생물 결과 카드 -->
                <div id="harmfulMarineCard" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 flex flex-col h-full shadow-sm">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        유해해양생물
                    </h3>
                    <div id="harmfulMarineContent" class="flex-grow flex flex-col justify-center">
                        <!-- 유해해양생물 데이터 삽입 -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="species-lookup.js"></script>
    <script>
        // API 설정
        const CITES_API_TOKEN = 'i86ai5ZJbCe2hAKFIR6c2Qtt';
        const KR_ENDANGERED_API_URL = "https://api.odcloud.kr/api/3071040/v1/uddi:4a6d6ef0-b2ae-4b8e-914a-ea645f743d50_201808031350?page=1&perPage=300&returnType=JSON&serviceKey=eede40796d5694cb71c776fe09f05a5445983e72276dbdda4d77b50cef4707ee";

        // 메모리에 저장할 멸종위기종 데이터 배열 (species-lookup.js의 checkKoreanEndangeredStatus에 전달)
        let krEndangeredData = [];
        let isInitialDataLoaded = false;

        // ※ 해양보호생물/국외반출승인대상/유입주의생물/생태계교란생물/생태계위해우려생물/
        //   회유성해양생물/유해해양생물 내장 데이터 및 checkXStatus 함수들은 species-lookup.js로 이동함
        //   (agent.html과 공유하기 위함, 로직/데이터 변경 없음)

        // DOM 요소 가져오기
        const searchForm = document.getElementById('searchForm');
        const scientificNameInput = document.getElementById('scientificName');
        const searchBtn = document.getElementById('searchBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const resultContainer = document.getElementById('resultContainer');
        const citesContent = document.getElementById('citesContent');
        const endangeredContent = document.getElementById('endangeredContent');
        const exportContent = document.getElementById('exportContent');
        const invasiveContent = document.getElementById('invasiveContent');
        const disturbanceContent = document.getElementById('disturbanceContent');
        const riskContent = document.getElementById('riskContent');
        const initStatus = document.getElementById('initStatus');
        const errorContent = document.getElementById('errorContent');
        const cardsContainer = document.getElementById('cardsContainer');

        /**
         * 페이지 진입 시 환경부 공공데이터(멸종위기종)를 1회만 호출하여 메모리에 저장합니다.
         */
        async function fetchInitialKrData() {
            try {
                const response = await fetch(KR_ENDANGERED_API_URL);
                
                if (!response.ok) {
                    throw new Error(`환경부 API 호출 실패 (상태 코드: ${response.status})`);
                }

                const data = await response.json();
                
                if (data && data.data) {
                    krEndangeredData = data.data; // 데이터를 메모리(배열)에 저장
                }

                // UI 업데이트: 로딩 성공
                isInitialDataLoaded = true;
                searchBtn.disabled = false; // 버튼 활성화
                
                initStatus.className = "mt-4 inline-flex items-center text-sm px-3 py-1 rounded-full bg-green-50 text-green-700 border border-green-100";
                initStatus.innerHTML = `
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    데이터 준비 완료 (총 ${krEndangeredData.length}종)
                `;
                
                // 3초 후 준비완료 메시지 서서히 숨기기
                setTimeout(() => {
                    initStatus.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                    setTimeout(() => initStatus.style.display = 'none', 500);
                }, 3000);

            } catch (error) {
                console.error("KR API Load Error:", error);
                
                // UI 업데이트: 로딩 실패 (조회는 막지 않으나 경고 표시)
                initStatus.className = "mt-4 inline-flex items-center text-sm px-3 py-1 rounded-full bg-red-50 text-red-600 border border-red-100";
                initStatus.innerHTML = `
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    국내 데이터를 불러오지 못했습니다. (CITES 조회만 가능)
                `;
                searchBtn.disabled = false; // CITES 조회를 위해 버튼은 열어둠
            }
        }

        // 페이지 로드 시 즉시 데이터 호출
        window.addEventListener('DOMContentLoaded', () => {
            fetchInitialKrData();
        });
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Enter 키 입력 시 새로고침 방지

            const query = scientificNameInput.value.trim();
            if (!query) return;

            // UI 상태 초기화: 로딩 시작 및 에러 숨김
            setLoadingState(true);
            hideResult();

            // species-lookup.js의 통합 조회 함수로 9개 카테고리를 한 번에 조회
            // (CITES/국내 멸종위기종은 실시간 API, 나머지는 내부 정적 데이터)
            const results = await window.SpeciesLookup.lookupAllCategories(query, {
                krEndangeredData,
                citesApiToken: CITES_API_TOKEN
            });

            renderResults(
                query,
                results.cites,
                results.kr_endangered,
                results.export_approval,
                results.invasive_alien,
                results.ecological_disturbance,
                results.ecological_risk,
                results.marine_protected,
                results.migratory_marine,
                results.harmful_marine
            );

            // 로딩 종료
            setLoadingState(false);
        });

        /**
         * CITES 결과 및 국내 보호/규제종 결과를 통합하여 화면에 출력합니다.
         */
        function renderResults(query, citesResult, krResult, exportResult, invasiveResult, disturbanceResult, riskResult, marineProtectedResult, migratoryMarineResult, harmfulMarineResult) {
            resultContainer.classList.remove('hidden');
            errorContent.classList.add('hidden');
            cardsContainer.classList.remove('hidden');

            // --- 1. CITES 결과 렌더링 ---
            if (citesResult.status === 'error') {
                citesContent.innerHTML = `<p class="text-sm text-red-500 font-medium text-center">조회 실패</p>`;
            } else if (citesResult.status === 'found') {
                const listing = citesResult.listing;

                let badgeClass = 'bg-red-100 text-red-800 border-red-200';
                if (listing.includes('I')) badgeClass = 'bg-red-100 text-red-800 border-red-200';
                else if (listing.includes('II')) badgeClass = 'bg-amber-100 text-amber-800 border-amber-200';
                else if (listing.includes('III')) badgeClass = 'bg-yellow-100 text-yellow-800 border-yellow-200';

                citesContent.innerHTML = `
                    <div class="flex justify-between items-center py-2">
                        <span class="text-sm font-bold text-gray-700">부속서</span>
                        <span class="px-4 py-1.5 rounded-full text-sm font-bold border ${badgeClass}">
                            CITES ${listing}
                        </span>
                    </div>
                    <div class="mt-2 text-xs text-gray-500 text-center">
                        학명: <span class="italic font-semibold">${citesResult.name || query}</span>
                    </div>
                `;
            } else {
                citesContent.innerHTML = `
                    <div class="flex justify-between items-center py-2">
                        <span class="text-sm font-bold text-gray-700">부속서</span>
                        <span class="px-4 py-1.5 rounded-full text-sm font-bold border bg-green-100 text-green-800 border-green-200">
                            해당 없음
                        </span>
                    </div>
                `;
            }

            // --- 2. 국내 멸종위기종 결과 렌더링 ---
            if (krResult.status === 'error') {
                endangeredContent.innerHTML = `<p class="text-sm text-red-500 font-medium text-center">${krResult.message}</p>`;
            } else if (krResult.status === 'found') {
                let badgeClass = 'bg-red-100 text-red-800 border-red-200';
                if (krResult.grade.includes('I급') || krResult.grade.includes('1급')) {
                    badgeClass = 'bg-red-100 text-red-800 border-red-200';
                } else if (krResult.grade.includes('II급') || krResult.grade.includes('2급')) {
                    badgeClass = 'bg-amber-100 text-amber-800 border-amber-200';
                }

                endangeredContent.innerHTML = `
                    <div class="flex justify-between items-center py-2">
                        <span class="text-sm font-bold text-gray-700">보호등급</span>
                        <span class="px-4 py-1.5 rounded-full text-sm font-bold border ${badgeClass}">
                            멸종위기 ${krResult.grade}
                        </span>
                    </div>
                    <div class="mt-2 text-xs text-gray-500 text-center">
                        학명: <span class="italic font-semibold">${krResult.name}</span>
                    </div>
                `;
            } else {
                endangeredContent.innerHTML = `
                    <div class="flex justify-between items-center py-2">

        function hideResult() {
            resultContainer.classList.add('hidden');
            citesContent.innerHTML = '';
            endangeredContent.innerHTML = '';
            exportContent.innerHTML = '';
            const invasiveContent = document.getElementById('invasiveContent');
            if (invasiveContent) invasiveContent.innerHTML = '';
            const disturbanceContent = document.getElementById('disturbanceContent');
            if (disturbanceContent) disturbanceContent.innerHTML = '';
            const riskContent = document.getElementById('riskContent');
            if (riskContent) riskContent.innerHTML = '';
            const marineProtectedContent = document.getElementById('marineProtectedContent');
            if (marineProtectedContent) marineProtectedContent.innerHTML = '';
            const migratoryMarineContent = document.getElementById('migratoryMarineContent');
            if (migratoryMarineContent) migratoryMarineContent.innerHTML = '';
            const harmfulMarineContent = document.getElementById('harmfulMarineContent');
            if (harmfulMarineContent) harmfulMarineContent.innerHTML = '';
            errorContent.classList.add('hidden');
        }

        function setLoadingState(isLoading) {
            if (isLoading) {
                searchBtn.disabled = true;
                // 버튼 텍스트 변경 대신 스피너 노출
                searchBtn.querySelector('span').textContent = "조회 중...";
                loadingSpinner.classList.remove('hidden');
            } else {
                searchBtn.disabled = false;
                searchBtn.querySelector('span').textContent = "통합 조회하기";
                loadingSpinner.classList.add('hidden');
            }
        }
